scope: pg-cluster
namespace: /service/
name: node1

log:
  level: INFO
  traceback_level: ERROR
  type: plain
  format: '%(asctime)s %(levelname)s: %(message)s'
  dateformat: '%Y-%m-%d %H:%M:%S'
  max_queue_size: 1000
  dir: /var/log/patroni
  file_size: 104857600
  file_num: 5
  loggers:
    patroni.postmaster: WARNING
    urllib3: WARNING

restapi:
  connect_address: 172.19.0.4:8008
  listen: 172.19.0.4:8008
  certfile: /etc/patroni/server.crt
  keyfile: /etc/patroni/server.key
  keyfile_password: key_pass
  cafile: /etc/patroni/ca.crt
  verify_client: optional
  http_extra_headers:
    X-Frame-Options: SAMEORIGIN
  https_extra_headers:
    X-Frame-Options: SAMEORIGIN

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    standby_cluster:
      host: 127.0.0.1
      port: 1111
      primary_slot_name: patroni
    postgresql:
      use_slots: true
      use_pg_rewind: true
      parameters:
        wal_level: hot_standby
        hot_standby: "on"
        max_connections: 100
        max_worker_processes: 8
        wal_keep_segments: 8
        max_wal_senders: 10
        max_replication_slots: 10
        max_prepared_transactions: 0
        max_locks_per_transaction: 64
        wal_log_hints: "on"
        track_commit_timestamp: "off"
        archive_mode: "on"
        archive_timeout: 1800s
        archive_command: mkdir -p ../wal_archive && test ! -f ../wal_archive/%f && cp %p ../wal_archive/%f
      recovery_conf:
        restore_command: cp ../wal_archive/%f %p
  initdb:  # Note: It needs to be a list (some options need values, others are switches)
  - encoding: UTF8
  - data-checksums

etcd3:
  hosts:
    - 10.0.0.1:2379
    - 10.0.0.2:2379
    - 10.0.0.3:2379
  host: 127.0.0.1:2379
  use_proxies: true

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 10.0.0.11:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/15/bin
  config_dir: /var/lib/postgresql/data
  pgpass: /var/lib/postgresql/.pgpass
  authentication:
    replication:
      username: replicator
      password: repl_pass
    superuser:
      username: postgres
      password: postgres_pass
    rewind:
      username: rewind_user
      password: rewind_pass
  parameters:
    unix_socket_directories: '/var/run/postgresql'
    logging_collector: "on"
    log_directory: /var/log/postgresql
    log_filename: postgresql-%Y-%m-%d.log
  basebackup:
    checkpoint: fast
    max-rate: '100M'
  pg_hba:
    - local all all 0.0.0.0/0 md5
    - host relication replicator 172.19.0.0/24 md5
  callbacks:
    on_start: /usr/local/bin/on_start.sh
    on_stop: /usr/local/bin/on_stop.sh
    on_restart: /usr/local/bin/on_restart.sh
    on_role_change: /usr/local/bin/on_role_change.sh

watchdog:
  mode: automatic   # off | automatic | required
  device: /dev/watchdog
  safety_margin: 5

tags:
  clonefrom: true
  failover_priority: 1
  noloadbalance: false
  nostream: false
  nosync: false
  sync_priority: 1
  phony_dead_eff_times: 3
  phony_dead_long_cycle_time: 300
  cpu_use_limit: 90
  mem_use_limit: 90
  disk_use_limit: 90
  log_use_limit: 100GB
